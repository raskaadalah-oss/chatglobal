name: Build ChatGlobal APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
          
      - name: Create Android Folder
        run: flutter create . --platforms android
        
      - name: Fix Package & App Name
        run: |
          grep -rl "com.example.chatglobal" android/ | xargs sed -i 's/com.example.chatglobal/Com.ChatGlobal.byAmar/g'
          grep -rl 'android:label="chatglobal"' android/ | xargs sed -i 's/android:label="chatglobal"/android:label="ChatGlobal V1"/g'
          
          mkdir -p android/app/src/main/kotlin/Com/ChatGlobal/byAmar
          mv android/app/src/main/kotlin/com/example/chatglobal/MainActivity.kt android/app/src/main/kotlin/Com/ChatGlobal/byAmar/MainActivity.kt
          sed -i 's/package com.example.chatglobal/package Com.ChatGlobal.byAmar/g' android/app/src/main/kotlin/Com/ChatGlobal/byAmar/MainActivity.kt
          rm -rf android/app/src/main/kotlin/com

      - name: Move google-services.json
        run: cp google-services.json android/app/

      - name: Download Icon
        run: |
          mkdir -p assets
          curl -L "https://files.catbox.moe/lpj1jd.png" -o assets/icon.png
          
      - name: Get Dependencies
        run: flutter pub get
        
      - name: Generate App Icon
        run: dart run flutter_launcher_icons
        
      - name: Build APK
        run: flutter build apk --release
        
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ChatGlobal-APK
          path: build/app/outputs/flutter-apk/app-release.apk
