name: Build ChatGlobal APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          
      - name: Create Android Folder
        run: flutter create . --org Com.ChatGlobal --project-name byAmar --platforms android
        
      - name: Move google-services.json
        run: cp google-services.json android/app/

      - name: Download Icon
        run: |
          mkdir -p assets
          curl -L "https://files.catbox.moe/lpj1jd.png" -o assets/icon.png
          
      - name: Get Dependencies
        run: flutter pub get
        
      - name: Generate App Icon
        run: dart run flutter_launcher_icons
        
      - name: Fix App Name
        run: |
          sed -i 's/android:label="byAmar"/android:label="ChatGlobal V1"/g' android/app/src/main/AndroidManifest.xml || true
        
      - name: Build APK
        run: flutter build apk --release
        
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ChatGlobal-APK
          path: build/app/outputs/flutter-apk/app-release.apk
